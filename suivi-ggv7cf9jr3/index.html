function jpost(url,body,form){
  return fetch(url,{method:'POST',headers:{'Content-Type':form?'application/x-www-form-urlencoded':'application/json'},body:form?body:JSON.stringify(body)}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error('http '+r.status);e.status=r.status;e.code=j&&j.error&&j.error.message;throw e;}return j;});

function fbErr(e){
  var c=(e&&e.code)||'';
  if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(c))return 'E-mail ou mot de passe incorrect.';
  if(/TOKEN_EXPIRED|USER_NOT_FOUND|USER_DISABLED|INVALID_REFRESH_TOKEN/.test(c))return 'Connexion expirée. Déconnecte puis reconnecte-toi.';
  if(e&&(e.status===401||e.status===403))return 'Publication refusée. Déconnecte puis reconnecte-toi.';

}
function fbToken(){

    FB.idToken=j.id_token;FB.exp=Date.now()+(+j.expires_in||3600)*1000;if(j.refresh_token&&j.refresh_token!==FB.refresh){FB.refresh=j.refresh_token;try{localStorage.setItem('odb-fb-refresh',FB.refresh);}catch(e){}}

  }).then(function(){FB.last=new Date().toISOString();FB.state='ok';FB.err='';},function(e){
    FB.dirty=true;FB.state='err';FB.err=fbErr(e);

function sc(sec,k){var v=draft[sec][k];return Array.isArray(v)?v:[null,null];}
function winner(s){if(s[0]==null||s[1]==null||s[0]===s[1])return null;return s[0]>s[1]?0:1;}
function ord(r){return r===1?'1er':r+'e';}
function qualifier(p,rank){var n=(draft.teams[p][rank-1]||'').trim();return n?{name:n,known:true}:{name:ord(rank)+' poule '+p,known:false};}
function slotsFor(r1,r2){var out=[];SEEDS.forEach(function(pr){out.push(qualifier(pr[0],r1));out.push(qualifier(pr[1],r2));});return out;}

function bracket(sec,prefix,base,slots){
  var blocks=[{off:0,slots:slots}],rounds=[],num=0,places=[];
  for(var r=1;r<=4;r++){
    var rb=[],next=[];
    blocks.forEach(function(bl){
      var n=bl.slots.length,W=[],L=[],ms=[];
      for(var k=0;k<n/2;k++){
        var a=bl.slots[2*k],b=bl.slots[2*k+1];num++;
        var id=r+'_'+bl.off+'_'+k,label=prefix+num,s=sc(sec,id),ready=a.known&&b.known,w=ready?winner(s):null;
        ms.push({id:id,label:label,a:a,b:b,s:s,ready:ready});
        if(w==null){W.push({name:'Vainq. '+label,known:false});L.push({name:'Perdant '+label,known:false});}
        else{W.push(w===0?a:b);L.push(w===0?b:a);}
      }
      rb.push({from:base+bl.off+1,to:base+bl.off+n,matches:ms});
      next.push({off:bl.off,slots:W},{off:bl.off+n/2,slots:L});
    });
    rounds.push({r:r,name:ROUND_NAMES[r-1],blocks:rb});blocks=next;
  }
  blocks.forEach(function(bl){places[bl.off]=bl.slots[0];});
  return {rounds:rounds,places:places};
}
function compute(){return {haut:bracket('haut','H',0,slotsFor(1,2)),bas:bracket('bas','B',16,slotsFor(3,4))};}

function matchErr(s,ready){
  if(!ready||VIEWER)return '';

function match(sec,id,label,a,b,s,ready){

    trow(a,sa,cell(sec,id,0,s[0],ready,a.name))+trow(b,sb,cell(sec,id,1,s[1],ready,b.name))+'</div>';
}

function viewBracket(sec,br){
  var base=sec==='haut'?0:16,map={};
  br.rounds.forEach(function(rd){rd.blocks.forEach(function(bl){map[rd.r+'_'+(bl.from-base-1)]=bl;});});
  var q=[{r:1,off:0}],trees=[];
  while(q.length){var t=q.shift();trees.push(t);for(var r=t.r;r<4;r++){var b0=map[r+'_'+t.off];q.push({r:r+1,off:t.off+(b0.to-b0.from+1)/2});}}
  trees.sort(function(a,b){return a.off-b.off;});

  var h=nErr?'<div class="alert" role="alert">'+(nErr===1?'1 match a un score à corriger.':nErr+' matchs ont un score à corriger.')+' Ils sont encadrés en rouge.</div>':'';

  });
  return h+'</div>';

function save(){
  if(saving||!art)return;saving=true;render();
  var out=clone(draft);out.updated=new Date().toISOString();
  ss('odb-stash',JSON.stringify({stamp:out.updated,draft:out}));ss('odb-tab',tab);ss('odb-scroll',String(window.scrollY||0));
  art.publish(buildDoc(out)).then(function(){toast('Enregistré');},function(err){
    saving=false;var c=err&&err.code;
    if(c==='conflict'){toast('Une autre version vient d’être enregistrée. La page se recharge avec tes modifications.');return;}
    ss('odb-stash',null);
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){canEdit=false;toast('Cette page est en lecture seule pour toi.');}
    else if(c==='rate_limited')toast('Trop d’enregistrements rapprochés. Réessaie dans quelques secondes.');
    else toast('Enregistrement impossible pour le moment. Réessaie.');
    render();
  });
}
function exportFile(){
  var d=new Date(),pad=function(x){return String(x).padStart(2,'0');};
  var name='open-double-burgers-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'-'+pad(d.getHours())+'h'+pad(d.getMinutes())+'.json';
  var url=URL.createObjectURL(new Blob([JSON.stringify(draft,null,1)],{type:'application/json'}));
  var l=document.createElement('a');l.href=url;l.download=name;document.body.appendChild(l);l.click();l.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);toast('Fichier exporté : '+name);
}

var app=document.getElementById('app');
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.classList.contains('sc')){
    var raw=t.value.trim(),v=raw===''?null:parseInt(raw,10);if(v!=null&&(isNaN(v)||v<0))v=null;if(v!=null&&v>99)v=99;
    var sec=t.dataset.sec,k=t.dataset.k,i=+t.dataset.i,cur=sc(sec,k).slice(0,2);cur[i]=v;
    if(cur[0]==null&&cur[1]==null)delete draft[sec][k];else draft[sec][k]=cur;queue();
  }else if(t.classList.contains('rk-in')){
    draft.teams[t.dataset.p][+t.dataset.i]=t.value.trim();queue();
  }else if(t.id==='imp'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){try{var o=norm(JSON.parse(fr.result));if(!o)throw 0;draft=o;persist();render();toast('Tournoi importé.');}catch(er){toast('Ce fichier n’est pas une sauvegarde du tournoi.');}};
    fr.readAsText(t.files[0]);
  }
});
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='takeover'){takeOver();return;}
  if(a==='tab'){tab=b.dataset.tab;ss('odb-tab',tab);try{history.replaceState(null,'','#'+tab);}catch(er){}render();window.scrollTo(0,0);}
  else if(a==='mode'){editMode=!editMode;render();}
  else if(a==='save')save();
  else if(a==='cancel'){draft=clone(saved);render();toast('Modifications annulées');}
  else if(a==='export')exportFile();
  else if(a==='gh-connect'){var ti=document.getElementById('gh-token');connectSite(ti?ti.value:'');}
  else if(a==='gh-publish'){publishNow();}
  else if(a==='fb-connect'){var fe=document.getElementById('fb-email'),fp=document.getElementById('fb-pw');fbConnect(fe?fe.value:'',fp?fp.value:'');}
  else if(a==='fb-publish'){fbPublish();}
  else if(a==='fb-off'){confirmClear='fb';render();}
  else if(a==='fb-off-yes'){confirmClear=false;clearTimeout(FB.timer);FB.refresh=null;FB.idToken=null;FB.state='off';try{localStorage.removeItem('odb-fb-refresh');}catch(e){}render();toast('Envoi instantané désactivé.');}
  else if(a==='gh-off'){confirmClear='gh';render();}
  else if(a==='gh-off-yes'){confirmClear=false;clearTimeout(GH.timer);GH.token=null;GH.state='off';try{localStorage.removeItem('odb-gh-token');}catch(e){}render();toast('Déconnecté. Les téléphones gardent les derniers résultats publiés.');}
  else if(a==='clear-scores'){confirmClear='scores';render();}
  else if(a==='clear-all'){confirmClear='all';render();}
  else if(a==='clear-no'){confirmClear=false;render();}
  else if(a==='clear-yes'){
    if(confirmClear==='all')POULES.forEach(function(p){draft.teams[p]=['','','',''];});
    draft.haut={};draft.bas={};confirmClear=false;persist();render();toast(OFFLINE?'Effacé.':'Effacé. Enregistre pour confirmer.');
  }
});

var VS={fail:false};
render();
if(OFFLINE&&GH.token&&GH.dirty)setTimeout(publishNow,1500);
if(OFFLINE&&FB.refresh)setTimeout(fbPublish,800);
if(OFFLINE)setTimeout(ghEnsureViewer,2500);
if(VIEWER){
  var newer=function(o){return o&&(!saved.updated||(o.updated||'')>=saved.updated);};
  var apply=function(o){if(!newer(o))return;VS.fail=false;if(JSON.stringify(o)!==JSON.stringify(saved)){saved=o;draft=clone(o);render();}else renderStatus();};
  var fromFb=function(v){if(!v||typeof v.payload!=='string')return null;try{return norm(JSON.parse(v.payload));}catch(e){return null;}};
  var fbObj={},es=null,esOk=false;
  var openStream=function(){
    if(es||typeof EventSource==='undefined')return;
    try{es=new EventSource(FB_DB+'/tournoi.json');}catch(e){es=null;return;}
    var onData=function(ev){try{var m=JSON.parse(ev.data);esOk=true;
      if(m.path==='/'){if(ev.type==='patch')Object.assign(fbObj,m.data||{});else fbObj=m.data||{};}else{fbObj[m.path.replace(/^\//,'')]=m.data;}
      var o=fromFb(fbObj);if(o)apply(o);}catch(e){}};
    es.addEventListener('put',onData);es.addEventListener('patch',onData);
    es.addEventListener('cancel',function(){closeStream();});
    es.onerror=function(){esOk=false;};
  };
  var closeStream=function(){if(es){try{es.close();}catch(e){}es=null;esOk=false;}};
  var pullFb=function(){return fetch(FB_DB+'/tournoi.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(v){var o=fromFb(v);if(o)apply(o);else throw 0;});};
  var pullGh=function(){return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){var o=norm(j);if(o)apply(o);});};
  var safety=function(){if(document.hidden)return;if(esOk)return;pullFb().catch(function(){return pullGh();}).catch(function(){VS.fail=true;renderStatus();});};
  pullFb().catch(function(){return pullGh();}).catch(function(){VS.fail=true;renderStatus();});
  openStream();setInterval(safety,10000);
  document.addEventListener('visibilitychange',function(){if(document.hidden)closeStream();else{openStream();safety();}});
}
var sy=ss('odb-scroll');if(sy){ss('odb-scroll',null);setTimeout(function(){window.scrollTo(0,+sy||0);},50);}
if(!OFFLINE&&!VIEWER&&window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('user'),window.claude.use('artifact')]).then(function(r){
    var u=r[0];art=r[1];
    if(u&&art)return u.canEdit().then(function(ok){canEdit=!!ok;});
  }).catch(function(){}).then(function(){render();if(restored&&canEdit)toast('Tes modifications non enregistrées ont été restaurées.');});
}
})();
</script>
